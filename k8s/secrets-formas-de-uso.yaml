# As três formas de consumir um Secret, lado a lado, cada uma num Job que
# imprime o resultado. Aplique e compare:
#   kubectl apply -f k8s/08-secrets-exemplos.yaml
#   kubectl -n adm-lab-folio logs job/secret-forma-1
#   kubectl -n adm-lab-folio logs job/secret-forma-2
#   kubectl -n adm-lab-folio logs job/secret-forma-3

# Forma 1 — envFrom: todas as chaves do Secret viram variáveis de ambiente.
# É a forma usada pelos manifestos deste laboratório, e a mesma usada em
# produção no Senado.
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-forma-1
  namespace: adm-lab-folio
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: exemplo
          image: busybox
          command: ["sh", "-c", "echo FORMA 1 - envFrom; echo FOLIO_PASSWORD=$FOLIO_PASSWORD"]
          envFrom:
            - secretRef: { name: folio-credenciais }
---
# Forma 2 — uma chave específica, podendo renomear a variável que o
# container enxerga.
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-forma-2
  namespace: adm-lab-folio
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: exemplo
          image: busybox
          command: ["sh", "-c", "echo FORMA 2 - env/secretKeyRef; echo SENHA_DO_FOLIO=$SENHA_DO_FOLIO"]
          env:
            - name: SENHA_DO_FOLIO       # nome que o container enxerga
              valueFrom:
                secretKeyRef:
                  name: folio-credenciais  # qual Secret
                  key: FOLIO_PASSWORD      # qual chave dentro dele
---
# Forma 3 — montado como arquivo. É a mais segura das três: o valor não
# aparece em "printenv" nem em log de exceção que despeja o ambiente, e o
# kubelet atualiza o arquivo quando o Secret muda, sem precisar reiniciar o Pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-forma-3
  namespace: adm-lab-folio
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: exemplo
          image: busybox
          command: ["sh", "-c", "echo FORMA 3 - volume; cat /segredos/FOLIO_PASSWORD; echo"]
          volumeMounts:
            - name: segredos
              mountPath: /segredos
              readOnly: true
      volumes:
        - name: segredos
          secret:
            secretName: folio-credenciais
            defaultMode: 0400   # só o dono lê
